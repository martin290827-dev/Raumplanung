<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raumplanung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <h1 class="brand">Raumplanung</h1>
      <button id="newBtn" class="btn primary" type="button">Neues Projekt</button>
      <button id="setBtn" class="btn" type="button">Einstellungen</button>
      <ul id="projects" class="plist" aria-label="Projekte"></ul>
      <div id="status" class="status"></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
